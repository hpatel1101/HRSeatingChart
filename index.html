<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7d8b68" />
  <meta name="description" content="Search your name to find your table and see who is seated with you." />
  <title>Find Your Table</title>
  <link rel="stylesheet" href="styles.css?v=20260908-3" />
  <style>
    .table-pill {
      min-width: 142px;
      margin: 18px auto 0;
      padding: 12px 24px;
      background: var(--accent);
      border: 1px solid var(--accent-dark);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 20px rgba(63, 72, 55, 0.14);
    }

    .table-list-number {
      margin: 0 0 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--accent-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 640px) {
      .table-pill {
        min-width: 130px;
        font-size: 1.3rem;
      }

      .table-list-number {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="monogram" aria-hidden="true">H <span>&</span> R</div>
      <p class="eyebrow">Seating Chart</p>
      <h1>Find Your Table</h1>
      <p class="subtitle">Search your name to find your table and see who you’ll be seated with.</p>

      <div class="tab-bar" role="tablist" aria-label="Seating chart views">
        <button class="tab-button active" id="tabSearch" type="button" role="tab" aria-selected="true" aria-controls="panelSearch" data-tab="search">Guest Search</button>
        <button class="tab-button" id="tabMap" type="button" role="tab" aria-selected="false" aria-controls="panelMap" data-tab="map">Seating Map</button>
      </div>
    </header>

    <section id="panelSearch" class="tab-panel active search-panel" role="tabpanel" aria-labelledby="tabSearch">
      <div class="search-wrap" id="searchWrap">
        <label class="sr-only" for="guestSearch">Search your name</label>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.7-4.7m2.2-5.3a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"></path>
          </svg>
          <input id="guestSearch" type="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Type your first or last name" aria-controls="suggestions" aria-expanded="false" />
          <button id="clearSearch" class="clear-button" type="button" aria-label="Clear search">×</button>
        </div>
        <div id="suggestions" class="suggestions" role="listbox" aria-label="Guest suggestions"></div>
        <p id="searchHint" class="search-hint">Start typing to search the guest list.</p>
      </div>

      <section id="result" class="result-section" aria-live="polite"></section>
    </section>

    <section id="panelMap" class="tab-panel map-panel" role="tabpanel" aria-labelledby="tabMap" hidden>
      <div class="map-card">
        <a class="map-link" href="HR_Seating_Table_Map.png" target="_blank" rel="noopener noreferrer" aria-label="Open full size seating map">
          <img class="map-image" src="HR_Seating_Table_Map.png" loading="lazy" decoding="async" alt="Ballroom seating map showing table locations." />
        </a>
      </div>
    </section>
  </main>

  <footer>We can’t wait to celebrate with you.</footer>

  <script src="seating-data.js?v=20260910-final"></script>
  <script src="app.js"></script>
  <script>
    const resultPanel = document.getElementById("result");
    const tableNumberObserver = new MutationObserver(() => {
      const tablePill = resultPanel.querySelector(".table-pill");
      const tableMates = resultPanel.querySelector(".table-mates");

      if (tablePill && tableMates && !tableMates.querySelector(".table-list-number")) {
        const tableNumber = document.createElement("div");
        tableNumber.className = "table-list-number";
        tableNumber.textContent = tablePill.textContent;
        tableMates.prepend(tableNumber);
      }
    });

    tableNumberObserver.observe(resultPanel, { childList: true, subtree: true });
  </script>
</body>
</html>
